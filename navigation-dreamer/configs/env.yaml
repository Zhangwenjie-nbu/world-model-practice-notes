# 环境基础配置（第一课版本）
env_name: "GridNavigationEnv"

# 地图尺寸
map_width: 10
map_height: 10

# 图像观测尺寸
image_size: 64

# 每个 episode 最大步数
max_steps: 100

# 动作空间：
# 0 = forward
# 1 = turn_left
# 2 = turn_right
# 3 = stay
num_actions: 4

# 奖励参数
goal_reward: 10.0
collision_penalty: 5.0
step_penalty: 0.01
progress_reward_scale: 1.0

# 成功判定阈值（agent 到 goal 的距离小于该值认为成功）
goal_radius: 0.8